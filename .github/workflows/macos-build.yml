name: macOS build (variante Mac)

# Only for the Mac variant branch. It never creates a GitHub release or tag, so the
# Windows releases and their auto-update feed stay untouched: the .dmg files are
# downloaded from the run page (Artifacts).
on:
  push:
    branches: [claude/loving-shannon-3fmyta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    env:
      # Downloads the castlabs ECS runtime for the target CPU (Apple Silicon or Intel).
      ELECTRON_INSTALL_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and ECS
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Configure Python for EVS
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned EVS client
        run: python -m pip install castlabs-evs==1.3.2

      - name: Prepare EVS authentication
        env:
          EVS_AUTH_JSON: ${{ secrets.EVS_AUTH_JSON }}
        run: |
          if [ -z "$EVS_AUTH_JSON" ]; then
            echo "::warning::EVS_AUTH_JSON not set: building with the ECS development VMP signature (protected streams may not play)."
            echo "QUADRA_MAC_VMP=dev" >> "$GITHUB_ENV"
            exit 0
          fi
          evs_config="$RUNNER_TEMP/evs-auth.json"
          printf '%s' "$EVS_AUTH_JSON" > "$evs_config"
          echo "EVS_CONFIG_FILE=$evs_config" >> "$GITHUB_ENV"
          echo "EVS_PYTHON=python" >> "$GITHUB_ENV"

      - name: Build .dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          QUADRA_BUILTIN_YOUTUBE_API_KEY: ${{ secrets.QUADRA_YOUTUBE_API_KEY }}
        run: |
          if [ -z "$QUADRA_BUILTIN_YOUTUBE_API_KEY" ]; then
            echo "::warning::QUADRA_YOUTUBE_API_KEY not set: the YouTube button will need a key in .env."
          fi
          npm run dist:mac -- --${{ matrix.arch }}

      - name: Verify app bundle
        run: |
          app=$(find release -maxdepth 2 -name 'Quadra.app' -type d | head -1)
          test -n "$app"
          codesign --verify --deep --verbose=2 "$app"
          find "$app" -name '*.sig' | grep -q . || { echo "VMP signature missing"; exit 1; }
          ls -la release/*.dmg

      # Opens the packaged app (fresh profile) and waits for the Quadra window's page to load.
      - name: Launch smoke (window opens)
        run: |
          app=$(find release -maxdepth 2 -name 'Quadra.app' -type d | head -1)
          profile="$RUNNER_TEMP/quadra-smoke-profile"
          rm -rf "$profile"
          QUADRA_TEST_USER_DATA="$profile" "$app/Contents/MacOS/Quadra" --remote-debugging-port=9333 > "$RUNNER_TEMP/quadra-smoke.log" 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9333/json/list 2>/dev/null | grep -q 'index.html'; then ok=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then echo "Quadra exited early"; break; fi
            sleep 1
          done
          echo "--- app output ---"; cat "$RUNNER_TEMP/quadra-smoke.log" || true
          curl -fsS http://127.0.0.1:9333/json/list 2>/dev/null || true
          kill "$pid" 2>/dev/null || true
          if [ "$ok" != 1 ]; then echo "::error::Quadra window did not open within 90 s"; exit 1; fi
          echo "Quadra window opened after ${i}s"

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Quadra-mac-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary EVS authentication
        if: always()
        run: rm -f "$RUNNER_TEMP/evs-auth.json"
