<!doctype html>
<html>
<head><meta charset="utf-8"><title>Quadra YouTube Watch Fixture</title></head>
<body>
  <div id="masthead-container">masthead</div>
  <div id="movie_player" class="html5-video-player ad-showing" style="width:640px;height:360px">
    <!-- Like YouTube: the container has no height and the player sizes the video inline. -->
    <div class="html5-video-container" style="position:relative">
      <video class="html5-main-video" muted style="position:absolute;width:640px;height:360px;left:0;top:0"></video>
    </div>
    <button class="ytp-skip-ad-button" id="skip-ad" type="button">Pular</button>
  </div>
  <div id="chat">chat</div>
  <script>
    window.__skipClicks = 0
    document.getElementById('skip-ad').addEventListener('click', () => {
      window.__skipClicks += 1
      document.getElementById('movie_player').classList.remove('ad-showing')
    })
  </script>
</body>
</html>
